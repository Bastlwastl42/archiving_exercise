[project]
name = "archive-exercise"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "isort>=8.0.1",
    "pyinstaller>=6.20.0",
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true
